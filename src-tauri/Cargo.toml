[package]
name = "research-workspace"
version = "0.11.0"
description = "Local-first research paper reading workspace"
authors = ["Research Workspace"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, called directly instead of through a wrapper crate: the surface
# used here is four functions, and keeping it explicit makes the storage boundary auditable.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
