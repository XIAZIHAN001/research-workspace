name: Quality gates

on:
  pull_request:
  push:
    branches: [main, fix/final-audit-remediation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and service (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Vitest (offline fixtures only)
        run: npm test
      - name: Vite production build
        run: npm run build
      - name: Prepare Chinese screenshot fonts
        if: matrix.node == '24'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-cache -f
          fc-match -f '%{family}: %{file}\n' 'Noto Sans CJK SC:lang=zh-cn'
      - name: Isolated Chromium recovery acceptance
        if: matrix.node == '24'
        shell: bash
        run: |
          chrome="$(command -v google-chrome)"
          BROWSER_PATH="$chrome" node scripts/verify/stability.mjs
      - name: Retain browser acceptance report
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-browser-${{ github.sha }}
          path: .cache/stability/**/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain isolated synthetic screenshots
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-browser-screenshots-${{ github.sha }}
          path: .cache/stability/**/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Rust and Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare frontend and Windows sidecar resources
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:prepare
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust release check
        run: cargo check --manifest-path src-tauri/Cargo.toml --release --locked
      - name: Record exact Windows build start
        env:
          RW_WINDOWS_FRESH_RUNNER: 'yes'
        run: node scripts/verify/windows-runtime.mjs --record-build-start
      - name: Build Windows Tauri NSIS installer
        run: npm run desktop:build -- --bundles nsis
      - name: Installed Windows runtime acceptance
        timeout-minutes: 10
        env:
          RW_WINDOWS_FRESH_RUNNER: 'yes'
        run: node scripts/verify/windows-runtime.mjs
      - name: Retain sanitized Windows runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-windows-runtime-${{ github.sha }}
          path: .cache/windows-runtime/**/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-windows-runtime-screenshots-${{ github.sha }}
          path: .cache/windows-runtime/**/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain installer for isolated manual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-windows-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Record remaining manual release gate
        if: always()
        shell: pwsh
        run: |
          @'
          ## Remaining Windows release acceptance
          Read the exact-commit installed-runtime report; a built installer or defined gate is not a runtime PASS.
          The fresh-hosted gate covers installed startup, Mock, synthetic credentials, endpoint binding,
          key deletion, restart persistence and normal/forced sidecar cleanup when its report says PASS.
          Consumer Windows 10/11 prerequisites, upgrade/uninstall and installer-dialog UX remain NOT RUN.
          PDF import/reading, notes, backup export/restore and forced-exit data recovery still need Windows UI acceptance.
          Use an isolated Windows account or fresh VM, never merely redirected APPDATA/LOCALAPPDATA,
          because Credential Manager and Known Folders are account scoped. Do not touch real workspaces or keys.
          This gate is not release approval; retain failures and blocked/unexecuted results accurately.
          '@ >> $env:GITHUB_STEP_SUMMARY
